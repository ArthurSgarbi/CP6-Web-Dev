<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ed" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('portfolio-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark'
          ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171a16' : '#f3f2ed';
      })();
    </script>
    <meta name="description" content="Arthur Sgarbi, estudante de Engenharia de Software na FIAP. Sites e aplicações para organizar informações, com projetos em React, TypeScript e desenvolvimento front-end." />

    <meta property="og:description" content="Conheça meus projetos, as decisões por trás do código e o que aprendo em Engenharia de Software na FIAP." />
